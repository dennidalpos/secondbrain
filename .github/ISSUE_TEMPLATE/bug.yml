name: Bug report
description: Report a defect in the scripts, the prompt catalog or the MCP server
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted data only: no secrets, personal data, host paths or raw logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: The observed behavior and the expected one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or prompt codes that reproduce the problem, in order.
      placeholder: |
        1. pwsh -NoProfile -File scripts/...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Content of the VERSION file.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows build, PowerShell version (`$PSVersionTable.PSVersion`) and Git version.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error message or message code, redacted.
      render: text
    validations:
      required: false
