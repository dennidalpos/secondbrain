[package]
name = "secondbrain-orchestrator"
version = "0.1.0"
description = "Desktop orchestrator that runs SecondBrain tracker tasks with Claude Code, Codex or Gemini CLI"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
tauri-plugin-dialog = "2.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
